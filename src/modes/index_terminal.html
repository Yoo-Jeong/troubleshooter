<!-- ============================================================
     홈 화면 조각 · 터미널 모드 (콘솔형)
     ※ index.html 이 가져가 끼우는 "화면 한 장". 콘텐츠는 PCB와 동일,
        표시 형식만 다름. 경로는 루트 기준(assets/…, characters.html).
     ============================================================ -->
<style>
  .feature{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px 0;overflow:hidden}
  .feature .kick{font-family:'Share Tech Mono';font-size:var(--fs-sm);letter-spacing:4px;color:var(--acc);margin-bottom:18px}
  .feature .sub{font-family:'Share Tech Mono';font-size:var(--fs-xs);letter-spacing:2.5px;color:var(--tx2);margin-top:8px}
  .feature .boot{font-family:'Share Tech Mono';font-size:var(--fs-2xs);color:var(--tx3);margin-top:9px;height:16px}
  .feature .boot .c{display:inline-block;width:5px;height:11px;background:var(--acc);vertical-align:-1px;margin-left:1px;animation:bl 1.1s step-end infinite}
  @keyframes bl{50%{opacity:0}}

  /* 콘솔은 .feature 밖 형제 → flex 로 화면 하단에 붙음. 폭은 프레임 기준(-24px)이라 좁은 창에서도 안 넘침 */
  .term{width:min(1100px,calc(100% - 24px));margin:0 auto 18px;
    border:1px solid var(--line);background:var(--panel);font-family:'Share Tech Mono';border-radius:3px;overflow:hidden}
  .term-hd{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:var(--fs-xs);letter-spacing:1.5px;color:var(--tx3)}
  .term-hd .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
  .term-hd .path{color:var(--tx2)}.term-hd .path b{color:var(--acc);font-weight:400}
  .term-hd .rr{margin-left:auto;color:var(--tx3)}
  .term-body{padding:10px 0 12px}
  .cmd{position:relative;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:9px clamp(14px,3vw,24px);white-space:nowrap;text-decoration:none;
    opacity:0;transform:translateY(3px);transition:background .2s ease}
  .cmd.reveal{opacity:1;transform:none;transition:opacity .3s ease,transform .3s ease,background .2s ease}
  .cmd .pr{color:var(--tx3);font-size:var(--fs-sm)}
  .cmd .txt{font-size:var(--fs-sm);letter-spacing:.5px;color:var(--tx3)}
  .cmd .ko{font-size:var(--fs-xs);letter-spacing:.5px;color:var(--tx3)}
  .cmd .st{margin-left:auto;font-size:var(--fs-2xs);letter-spacing:.5px;color:var(--tx3);display:flex;align-items:center;gap:14px}
  .cmd .note{font-size:var(--fs-2xs);color:var(--tx3)}
  .cmd .tag{font-size:var(--fs-xs);letter-spacing:1px}
  /* 기본 = 뉴트럴 / hover·선택 시 시안 */
  .cmd.on{cursor:pointer}
  .cmd.on .txt{color:var(--tx)}
  .cmd.on .ko{color:var(--tx3)}
  .cmd.on .tag,.cmd.on .note{color:var(--tx3)}
  .cmd.on:hover{background:var(--bg2)}
  .cmd.on:hover .pr,.cmd.on:hover .txt,.cmd.on:hover .txt .db,.cmd.on:hover .ko,.cmd.on:hover .tag,.cmd.on:hover .note{color:var(--acc)}
  .cmd.on .cur{display:inline-block;width:6px;height:12px;margin-left:2px;background:var(--acc);vertical-align:-1px;opacity:0;transition:opacity .15s}
  .cmd.on:hover .cur{opacity:1;animation:bl 1s step-end infinite}
  /* 잠금(더미) = 이름을 빗금 바로 가림 (읽을 수 있는 글자 없음) */
  .cmd.lock{cursor:not-allowed;color:var(--tx3);opacity:.7}
  .cmd.lock .tag{color:var(--tx3)}
  .cmd .rd{display:inline-block;width:clamp(88px,20vw,150px);height:11px;vertical-align:-1px;border-radius:1px;
    background:repeating-linear-gradient(135deg,var(--line2) 0 5px,transparent 5px 9px)}

  /* 좁은 화면(모바일 비율, 사이트 공통 700px 기준) — 라벨이 길면(GALLERY_DB 등) 상태(記RECORDS·[ENTER])만
     자리가 모자라 혼자 줄바꿈되어 삐뚤빼뚤해 보임 → 아예 모든 줄에서 상태를 둘째 줄로 고정해 가지런하게 맞춘다 */
  @media(max-width:700px){
    .cmd{row-gap:3px}
    .cmd .st{flex-basis:100%;margin-left:0;padding-left:24px;justify-content:space-between}
  }

  /* 터미널 중앙 로고 링 — 고정 높이 단말기라 고정px */
  .tring{position:relative;width:260px;aspect-ratio:1;margin:6px auto 14px;display:flex;align-items:center;justify-content:center}
  .tring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .tring .spin{transform-origin:150px 150px;animation:sp 90s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .tring .logo{width:56%;opacity:.9}
  :root[data-theme="light"] .tring .logo{filter:brightness(.6) saturate(1.5)}
  .tring .trl{position:absolute;font-family:'Share Tech Mono';font-size:var(--fs-2xs);letter-spacing:1.5px;color:var(--tx3);white-space:nowrap}
  .tring .trl.a{top:-3px;left:-8px}.tring .trl.b{top:-3px;right:-8px}.tring .trl.c{bottom:-3px;left:-8px}.tring .trl.d{bottom:-3px;right:-8px}
</style>

<main class="feature">
  <div class="kick mono">DATABASE ACCESS</div>

  <div class="tring">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle cx="150" cy="150" r="132" fill="none" stroke="var(--line2)" stroke-width="1"/>
      <g class="spin"><circle cx="150" cy="150" r="132" fill="none" stroke="var(--acc)" stroke-width="1.4" stroke-dasharray="40 360" stroke-linecap="round"/><circle cx="150" cy="18" r="2" fill="var(--acc)"/></g>
    </svg>
    <img class="logo" src="assets/img/ui/ts_typo.png" alt="TROUBLESHOOTER">
    <span class="trl a">◈ TS-TERM</span><span class="trl b">ENCRYPTED</span><span class="trl c">SIG ///</span><span class="trl d">READ-ONLY</span>
  </div>

  <!-- 홈 공통 하단 캡션 -->
  <div class="sub mono">INTEGRATED DATABASE · 통합 데이터베이스</div>
  <div class="boot mono"><span id="boot2"></span><span class="c"></span></div>
</main>

<!-- 터미널 콘솔 메뉴 — 화면 하단에 고정. feature 밖 형제라 중앙정렬 안 따라가고 하단에 붙음 -->
<nav class="term" aria-label="데이터베이스 접근">
  <div class="term-hd">
    <span class="dot"></span>
    <span class="path">agent@ts-db<b>:~/archive</b>$</span>
    <span class="rr">ls -l /db</span>
  </div>
  <div class="term-body">
    <a class="cmd on" href="world/" data-ts="accesslog"><span class="pr">&gt;</span><span class="txt"><span class="cx">ACCESS </span>WORLD_DB</span><span class="ko">세계관</span><span class="st"><span class="note">-- RECORDS</span><span class="tag">[ ENTER ]</span></span><span class="cur"></span></a>
    <a class="cmd on" href="characters.html" data-ts="accesslog"><span class="pr">&gt;</span><span class="txt"><span class="cx">ACCESS </span><span class="db">CHARACTERS_DB</span></span><span class="ko">인물</span><span class="st"><span class="note">6 RECORDS</span><span class="tag">[ OK ]</span></span><span class="cur"></span></a>
    <a class="cmd on" href="gallery/" data-ts="accesslog"><span class="pr">&gt;</span><span class="txt"><span class="cx">ACCESS </span>GALLERY_DB</span><span class="ko">갤러리</span><span class="st"><span class="note">-- RECORDS</span><span class="tag">[ OK ]</span></span><span class="cur"></span></a>
    <a class="cmd on" href="logs/" data-ts="accesslog"><span class="pr">&gt;</span><span class="txt"><span class="cx">ACCESS </span>LOGS_DB</span><span class="ko">교신기록</span><span class="st"><span class="note">-- RECORDS</span><span class="tag">[ OK ]</span></span><span class="cur"></span></a>
    <a class="cmd lock" aria-disabled="true"><span class="pr">&gt;</span><span class="txt"><span class="cx">ACCESS </span><span class="rd"></span></span><span class="st"><span class="tag">[OFFLINE]</span></span></a>
  </div>
</nav>
