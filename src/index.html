<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS·OS // DATABASE TERMINAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=Share+Tech+Mono&family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">

<!-- 공통 디자인·동작 + 공통 트랜지션 모듈 -->
<link rel="stylesheet" href="assets/css/common.css?v=2">
<link rel="stylesheet" href="assets/css/transitions.css?v=1">
<script src="assets/js/common.js?v=6"></script>
<script src="assets/js/transitions.js?v=3"></script>
<script src="assets/js/cusdis-config.js?v=1"></script>
<!-- 갤러리 그림 목록(단일 출처) — GALLERY 노드의 "N RECORDS" 표시가 이 데이터 개수를 그대로 씀 -->
<script src="assets/js/gallery-data.js?v=1"></script>

<style>
  /* ============================================================
     이 파일은 "틀"입니다 — 상단바 · 푸터 · 부팅 화면만 담당.
     가운데 홈 화면(PCB/터미널/미니멀/오빗)은 modes/index_<모드>.html 에
     따로 있고, 아래 로더가 골라 #modeMount 안에 끼워 넣습니다.
     → 홈 화면 생김새를 고치려면 index.html 이 아니라 modes/ 파일을 여세요.
     ============================================================ */
  /* 모드 조각이 끼워지는 자리 = 상단바와 푸터 사이를 꽉 채우는 세로 영역.
     조각 안의 .feature(flex:1)와 하단 nav(터미널·미니멀)가 여기서 원래처럼 배치됨 */
  #modeMount{flex:1;min-height:0;display:flex;flex-direction:column}

  /* ===== 로드 실패 화면 (조각이 안 실렸을 때 = 대개 file:// 로 직접 열었을 때).
     조각의 .feature 스타일이 없으므로 여기서 자체적으로 세로 중앙 정렬 ===== */
  .load-err{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;overflow:hidden}
  .load-err .sym{width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));border-radius:10px;
    font-size:24px;color:var(--acc);box-shadow:0 0 24px -6px var(--acc);margin-bottom:20px}
  .load-err .ttl{font-family:'Share Tech Mono';font-size:var(--fs-lg);font-weight:600;letter-spacing:5px;
    color:var(--acc);margin-bottom:12px}
  .load-err .msg{font-size:var(--fs-base);color:var(--tx2);line-height:1.85;max-width:620px;margin-bottom:22px}
  .load-err .msg b{color:var(--tx);font-weight:600}
  /* 안내 = 콘솔 박스 (왼쪽 정렬, 단말기 톤) */
  .load-err .hint{font-family:'Share Tech Mono';font-size:var(--fs-xs);letter-spacing:.3px;text-align:left;
    width:min(620px,100%);border:1px solid var(--line);background:var(--panel);border-radius:8px;overflow:hidden}
  .load-err .hint .hh{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);
    background:var(--bg2);color:var(--tx3);letter-spacing:1px}
  .load-err .hint .hh .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
  .load-err .hint .hb{padding:12px 14px;display:flex;flex-direction:column;gap:8px;color:var(--tx2);line-height:1.5}
  .load-err .hint .ln{display:flex;gap:9px}
  .load-err .hint .ln::before{content:"›";color:var(--acc)}
  .load-err .hint .ln b{color:var(--acc);font-weight:400}
  .load-err .hint .ln.dim{color:var(--tx3)}
  .load-err .hint .ln.dim::before{content:"·";color:var(--tx3)}
  /* 팁 묶음 헤더 — 단계(1~4)와 구분선으로 분리 */
  .load-err .hint .tiph{color:var(--acc);letter-spacing:1px;border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
  .load-err .det{font-family:'Share Tech Mono';font-size:var(--fs-2xs);color:var(--tx3);margin-top:18px;letter-spacing:.3px;
    max-width:620px;word-break:break-all}
</style>
</head>
<body>
  <div class="screen">
    <div class="osbar mono">
      <img class="lg" src="assets/img/ui/ts_typo.png" alt="">
      <span class="os">TS·OS</span>
      <span class="sec"><span class="d"></span>SECURE LINK</span>
      <div class="right">
        <span>CENTRAL DB</span>
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><span id="batp">82%</span><span class="b"><i></i></span></span>
        <span id="clock">--:--</span>
        <button class="tg" id="themeBtn" title="테마 전환">◐</button>
      </div>
    </div>

    <!-- ▼ 여기에 modes/index_<모드>.html 이 통째로 끼워집니다 (로더가 처리) -->
    <div id="modeMount" aria-live="polite"></div>

    <footer class="foot">
      <span><span class="g">AGENT</span> · UID 000-ACCESS</span>
      <span class="r">TS-DB · TERMINAL v2.04</span>
    </footer>
  </div>

  <!-- 첫 진입 부팅 오버레이 (세션당 1회 · 첫 페인트부터 화면을 덮어 깜빡임 방지) -->
  <div class="ts-boot" id="connect">
    <div class="ct mono">TS·OS <b>HANDHELD DATABASE TERMINAL</b> v2.04</div>
    <div class="cl mono" id="cl"></div>
    <div class="pbar"><i id="pb"></i></div>
  </div>
  <script>
    /* 이번 세션에 이미 부팅했으면(목록 등에서 홈 복귀) 부팅 오버레이를 '그려지기 전에' 즉시 숨김
       → 재방문 때 부팅 화면이 순간 번쩍이는 것 방지. (파싱 중 동기 실행이라 페인트 전에 적용) */
    try { if (sessionStorage.getItem('ts-booted')) {
      var _c = document.getElementById('connect');
      if (_c) { _c.style.transition = 'none'; _c.style.opacity = '0'; _c.style.visibility = 'hidden'; _c.style.pointerEvents = 'none'; }
    } } catch (e) {}
  </script>

<script>
/* ============================================================
   홈 화면 조각 로더 — 단일 출처: modes/index_<모드>.html
   · 저장된(또는 ?home= 로 강제된) 모드 조각을 fetch 로 가져와 #modeMount 에 주입
   · 조각은 화면(HTML+CSS)만 담고, 모드별 동작(부팅 캡션·터미널 리빌·오빗 패럴랙스)은
     아래에서 배선 → "생김새=modes/, 동작=여기" 로 분리
   · window.TS_loadHome(id) : 설정 패널(common.js)이 모드 전환 시 호출
   ============================================================ */
(function(){
  var root = document.documentElement;
  var bare = root.hasAttribute('data-bare');   // 프리뷰 iframe(?bare=1) : 부팅 생략, 즉시 노출
  var booted = false;
  var curId = null;   // 마지막으로 요청받은 모드(사용자가 고른 원래 모드) — 화면 폭이 바뀌면 이 값으로 다시 그림

  /* PCB 모드는 화면이 좁아지면 자체 2열 그리드 폴백(표처럼 보임)으로 바뀌는데, 그 폴백이 나오기
     시작하는 지점(index_pcb.html의 @media(max-width:980px)) 부터 아예 터미널 화면을 대신 보여준다
     — 세로로 쌓는 터미널 쪽이 훨씬 잘 읽힘. 두 값은 반드시 같이 맞출 것(단일 출처는 아니지만 짝 값). */
  var MOBILE_MQ = window.matchMedia('(max-width:980px)');
  function effectiveId(id){ return (id === 'pcb' && MOBILE_MQ.matches) ? 'terminal' : id; }

  // 모드별 부팅 캡션 문구 + 푸터 라벨
  var CAPTION = {
    pcb:      'CONNECTION ENCRYPTED · AUTHORIZED ACCESS ONLY',
    terminal: 'CONNECTION ENCRYPTED · AUTHORIZED ACCESS ONLY',
    minimal:  'CONNECTION ENCRYPTED · AUTHORIZED ACCESS ONLY',
    orbit:    'CONNECTION ENCRYPTED · AGENT'
  };
  var FOOTLABEL = { pcb:'PCB', terminal:'TERMINAL', minimal:'MINIMAL', orbit:'ORBIT' };

  function typeBoot(id){
    var m = CAPTION[id] || CAPTION.pcb, e = document.getElementById('boot2');
    if(!e) return; var j = 0;
    (function t(){ if(j<=m.length){ e.textContent = m.slice(0,j); j++; setTimeout(t,40); } })();
  }
  function revealTerm(instant){   // 터미널 콘솔 행 순차(또는 즉시) 노출
    document.querySelectorAll('.term .cmd').forEach(function(r,i){
      if(instant){ r.classList.add('reveal'); return; }
      setTimeout(function(){ r.classList.add('reveal'); }, i*110);
    });
  }

  /* 모드별 동작 배선 — 조각이 끼워진 직후 실행 */
  function initMode(id){
    if(id === 'pcb'){
      // 배경 더미 클릭 시 ACCESS DENIED 반짝임
      document.querySelectorAll('.dummy').forEach(function(d){
        d.addEventListener('click', function(){ d.classList.remove('denied'); void d.offsetWidth; d.classList.add('denied'); });
      });
    } else if(id === 'orbit'){
      buildCodeStream();
      startParallax();
    }
    loadLogsCount();     // LOGS 카드의 "-- RECORDS" → 실제 달린 댓글 수. 그 자리 없는 모드(minimal/orbit)에선 조용히 아무 일도 안 함
    loadGalleryCount();  // GALLERY 카드의 "-- RECORDS" → 실제 등록된 그림 수
  }

  /* LOGS(교신기록)에 실제로 달린 댓글 수를 Cusdis 공개 API로 받아와 "-- RECORDS" 자리에 채운다.
     CHARACTERS의 "6 RECORDS"처럼 정적으로 손으로 못 박을 수 없는 값(누구나 언제든 댓글을 남길 수 있어서)이라
     매번 조각을 새로 그릴 때마다 새로 받아온다. 실패해도(오프라인 등) 원래 문구(-- RECORDS)가 그대로 남을 뿐이라 안전. */
  function loadLogsCount(){
    if(!window.CUSDIS_APP_ID) return;
    fetch('https://cusdis.com/api/open/comments?appId=' + window.CUSDIS_APP_ID + '&pageId=logs&page=1')
      .then(function(r){ return r.json(); })
      .then(function(j){
        var n = j && j.data && typeof j.data.commentCount === 'number' ? j.data.commentCount : null;
        if(n === null) return;
        // href="logs/" 링크 안의 레코드 표시 자리 — PCB(.st2)·터미널(.note) 둘 다 이 하나의 셀렉터로 커버(모드별 분기 없음)
        document.querySelectorAll('a[href="logs/"] .st2, a[href="logs/"] .note').forEach(function(el){
          el.textContent = n + ' RECORDS';
        });
      })
      .catch(function(){});
  }

  /* GALLERY(갤러리)에 실제로 등록된 그림 수를 "-- RECORDS" 자리에 채운다. 데이터는 assets/js/gallery-data.js
     (단일 출처, gallery/index.html과 공유) — 이 파일이 이미 <head>에서 로드돼 있어 fetch 없이 바로 읽을 수 있음. */
  function loadGalleryCount(){
    var items = window.GALLERY_ITEMS; if(!items) return;
    document.querySelectorAll('a[href="gallery/"] .st2, a[href="gallery/"] .note').forEach(function(el){
      el.textContent = items.length + ' RECORDS';
    });
  }

  /* 오빗 : 좌상단 데이터 코드 스트림 생성 */
  function buildCodeStream(){
    var col = document.getElementById('codecol'); if(!col) return;
    var hx = '0123456789ABCDEF';
    function h(n){ var s=''; for(var i=0;i<n;i++) s += hx[(i*7+n*3+5)%16]; return s; }
    var tpl = ['&gt; 0x'+h(6)+' LINK <b>OK</b>','<span class="dim">TS-DB::</span> '+h(2)+' '+h(2)+' '+h(2)+' '+h(2),'&gt; ACCESS NODE :: 0x'+h(4)+' <b>GRANTED</b>','REC '+h(3)+' / 006 <b>OK</b>','<span class="dim">'+h(2)+' '+h(2)+' '+h(2)+' '+h(2)+'</span>','&gt; DECRYPT 0x'+h(8),'HQ &gt;&gt; NODE 0x'+h(4)+' SYNC <b>OK</b>'];
    var lines=''; for(var i=0;i<32;i++) lines += '<div class="ln">'+tpl[i%tpl.length]+'</div>';
    col.innerHTML = lines + lines;
  }
  /* 오빗 : 마우스 패럴랙스(틸트 무대 + 데코). 모드가 바뀌어 무대가 사라지면 루프 종료 */
  function startParallax(){
    var S = document.getElementById('stage'), decos = document.querySelectorAll('.deco'), tx=0,ty=0,cx=0,cy=0;
    if(!S || window.matchMedia('(max-width:1080px)').matches) return;
    window.addEventListener('mousemove', function(e){ tx=(e.clientX/window.innerWidth-.5)*2; ty=(e.clientY/window.innerHeight-.5)*2; });
    (function anim(){
      if(!document.body.contains(S)) return;              // 조각 교체로 무대 제거 → 정지
      cx+=(tx-cx)*.06; cy+=(ty-cy)*.06;
      S.style.transform = 'rotateX('+(16-cy*6)+'deg) rotateY('+(cx*7)+'deg)';
      var f=[40,26,32,20]; decos.forEach(function(d,i){ d.style.transform='translate('+(cx*f[i%4])+'px,'+(cy*f[i%4]*.6)+'px)'; });
      requestAnimationFrame(anim);
    })();
  }

  /* 부팅 종료(또는 프리뷰) 후 : 캡션 타이핑 + 터미널 행 노출 */
  function afterReady(id){
    typeBoot(id);
    if(id === 'terminal') revealTerm(bare);
  }

  function setFoot(id){
    var r = document.querySelector('.foot .r');
    if(r) r.textContent = 'TS-DB · ' + (FOOTLABEL[id] || 'DATABASE') + ' v2.04';
  }

  /* 로드 실패(대개 file:// 로 직접 열었을 때) 안내 */
  function showError(mount, id, err){
    var cn = document.getElementById('connect'); if(cn) cn.classList.add('done');
    setFoot(id);
    mount.innerHTML =
      '<div class="load-err">' +
        '<div class="sym">⚠</div>' +
        '<div class="ttl">LOAD ERROR</div>' +
        '<div class="msg">홈 화면 <b>' + id + '</b> 을(를) 불러오지 못했습니다.<br>이 사이트는 <b>로컬 서버</b>에서 열어야 정상 동작합니다.</div>' +
        '<div class="hint">' +
          '<div class="hh"><span class="dot"></span>SERVE · 이렇게 열어주세요</div>' +
          '<div class="hb">' +
            '<div class="ln"><b>1.</b> 터미널(PowerShell)을 엽니다</div>' +
            '<div class="ln"><b>2.</b> 그 폴더로 이동 — <b>cd</b> 뒤에 폴더 경로 입력 (예: <b>cd C:\\projects\\troubleshooter</b>)</div>' +
            '<div class="ln"><b>3.</b> <b>jekyll serve --livereload</b> 실행 — 창은 켜 둡니다</div>' +
            '<div class="ln"><b>4.</b> 브라우저 주소창에 <b>http://localhost:4000</b></div>' +
            '<div class="tiph">팁</div>' +
            '<div class="ln dim">cd 입력 뒤 폴더를 터미널로 끌어다 놓으면 경로 자동 입력</div>' +
            '<div class="ln dim">jekyll 서버 끄기 = 터미널에서 Ctrl + C</div>' +
            '<div class="ln dim">file:// 직접열기는 지원 안 함</div>' +
          '</div>' +
        '</div>' +
        '<div class="det">detail: ' + ((err && err.message) || err) + '</div>' +
      '</div>';
  }

  /* ===== 조각 로더 (전역 공개) ===== */
  window.TS_loadHome = function(id){
    id = id || 'pcb';
    curId = id;
    var renderId = effectiveId(id);   // 실제로 불러올 조각(좁은 화면의 pcb→terminal 대체 포함)
    var mount = document.getElementById('modeMount');
    return fetch('modes/index_' + renderId + '.html', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(html){
        mount.innerHTML = html;
        initMode(renderId);
        setFoot(renderId);
        if(window.TS && TS.wire) TS.wire(mount);           // 조각 안 data-ts 링크 전환 배선
        if(!booted && !bare){
          booted = true;
          TS.boot({ el: document.getElementById('connect'), onDone: function(){ afterReady(renderId); } });
        }else{
          var cn = document.getElementById('connect'); if(cn) cn.classList.add('done');
          afterReady(renderId);
        }
      })
      .catch(function(err){ showError(mount, renderId, err); });
  };

  // 화면 폭이 700px 경계를 넘나들 때(창 크기 조절·회전 등) pcb↔terminal 화면을 다시 그림.
  // 이미 불러온 뒤라 booted=true → 부팅 연출 없이 조각만 조용히 교체됨.
  MOBILE_MQ.addEventListener('change', function(){
    if(curId) window.TS_loadHome(curId);
  });

  // 첫 진입 — 저장된(또는 ?home= 로 강제된) 모드를 불러온다
  window.TS_loadHome(root.getAttribute('data-home') || 'pcb');
})();
</script>
</body>
</html>
