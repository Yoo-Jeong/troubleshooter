# GitHub Pages 배포 워크플로
# main에 push되면 로컬과 동일하게 `jekyll build`로 빌드해서 Pages에 올림
# (source: src 등 _config.yml 설정을 그대로 쓰기 위해, GitHub 기본 제공 Jekyll 빌드 대신
#  이 저장소에서 직접 jekyll build를 실행하는 방식을 씀)

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Ruby 설치
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Jekyll 설치 (로컬과 같은 버전)
        run: gem install jekyll -v 4.4.1

      - name: 빌드 (source: src → destination: _site, _config.yml 기준)
        run: jekyll build

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 빌드 결과물(_site) 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
