<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS·OS // RADIAL v2 (PULSE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=Share+Tech+Mono&family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- 공통 디자인·동작 -->
<link rel="stylesheet" href="../assets/css/common.css?v=2">
<script src="../assets/js/common.js?v=2"></script>

<style>
  /* ===== 홈 전용 ===== */
  .feature{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px 0}
  .feature .kick{font-family:'Share Tech Mono';font-size:11px;letter-spacing:4px;color:var(--acc);margin-bottom:8px}
  .ring{position:relative;width:clamp(190px,26vh,250px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ring .spin{transform-origin:150px 150px;animation:sp 90s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ring .logo{width:54%;opacity:.9}
  :root[data-theme="light"] .ring .logo{filter:brightness(.6) saturate(1.5)}
  .ring .rl{position:absolute;font-family:'Share Tech Mono';font-size:8px;letter-spacing:1.5px;color:var(--tx3);white-space:nowrap}
  .ring .rl.a{top:-2px;left:-6px}.ring .rl.b{top:-2px;right:-6px}.ring .rl.c{bottom:-2px;left:-6px}.ring .rl.d{bottom:-2px;right:-6px}
  /* 코어에서 은은히 퍼지는 브로드캐스트 링 (데이터 방출 느낌) */
  .ring .beacon{position:absolute;inset:0;border-radius:50%;border:1px solid var(--acc);opacity:0;animation:beacon 3.4s ease-out infinite}
  @keyframes beacon{0%{transform:scale(.72);opacity:.5}70%{opacity:0}100%{transform:scale(1.25);opacity:0}}

  .feature .sub{font-family:'Share Tech Mono';font-size:12.5px;letter-spacing:2.5px;color:var(--tx2);margin-top:10px}
  .feature .boot{font-family:'Share Tech Mono';font-size:12px;color:var(--tx3);margin-top:12px;height:16px}
  .feature .boot .c{display:inline-block;width:5px;height:11px;background:var(--acc);vertical-align:-1px;margin-left:1px;animation:bl 1.1s step-end infinite}
  @keyframes bl{50%{opacity:0}}

  /* ============================================================
     ORBIT — 4개 노드를 코어에서 "같은 거리(--r)"로 N/E/S/W 대칭 배치.
     각 노드는 스포크(연결선)로 코어와 이어지고,
     선 위로 데이터 펄스(빛)가 흐르고 접점엔 깜빡이는 점이 있다.
     ============================================================ */
  .orbit{position:relative;display:flex;align-items:center;justify-content:center;
    width:min(720px,94vw);
    --ringsz:clamp(172px,22.5vh,214px);         /* 코어 링 지름 */
    --ringR:calc(var(--ringsz) * .44);          /* 보이는 원의 반지름(대략) */
    --gap:clamp(40px,6vh,64px);               /* ★원 가장자리 → 노드까지 균일 간격 (등거리 핵심) */
    --core:calc(var(--ringR) + var(--gap));     /* 중심 → 노드 안쪽모서리 (4방향 동일) */
    --spoke:var(--gap);                          /* 스포크 = 그 간격 전체를 채움 */
    min-height:calc(var(--core)*2 + 180px);     /* 노드 몸통까지 감싸도록 여유 확보 */
    margin:2px auto}
  .orbit .ring{margin:0;width:var(--ringsz)}

  .node{position:absolute;top:50%;left:50%;width:148px;box-sizing:border-box;
    background:var(--panel);border:1px solid var(--line);
    padding:10px 13px 11px;display:flex;flex-direction:column;gap:3px;
    transition:border-color .25s,background .25s,box-shadow .25s;z-index:2;
    --pulse:var(--tx3);--track:var(--line);--dot:var(--tx3)}   /* 기본(잠금) 색 */
  .node .n{font-family:'Share Tech Mono';font-size:10px;letter-spacing:1px;color:var(--tx3)}
  .node .en{font-family:'Chakra Petch';font-weight:500;font-size:14px;letter-spacing:.5px;margin-top:2px;color:var(--tx)}
  .node .ko{font-size:12px;color:var(--tx2)}
  .node .st2{font-family:'Share Tech Mono';font-size:8.5px;letter-spacing:.5px;color:var(--tx3);margin-top:6px}

  /* 방위별 위치 — 노드 "안쪽 모서리"를 중심에서 --core 거리에 앵커.
     박스 크기가 달라도 원 가장자리로부터 간격(--gap)이 4방향 모두 동일해진다. */
  .n-n{left:50%;top:auto;bottom:calc(50% + var(--core));transform:translateX(-50%)}
  .n-s{left:50%;top:calc(50% + var(--core));transform:translateX(-50%)}
  .n-e{top:50%;left:calc(50% + var(--core));transform:translateY(-50%)}
  .n-w{top:50%;left:auto;right:calc(50% + var(--core));transform:translateY(-50%)}

  /* ── 스포크(::before) = 바탕선 + 흐르는 데이터 펄스(움직이는 그라디언트) ── */
  .node::before{content:"";position:absolute;z-index:1;background-color:var(--track);
    background-repeat:no-repeat;
    animation-duration:2.8s;animation-timing-function:linear;animation-iteration-count:infinite}
  /* 가로 스포크 (E/W) */
  .n-e::before,.n-w::before{top:50%;height:2px;width:var(--spoke);transform:translateY(-50%);
    background-image:linear-gradient(90deg,transparent,var(--pulse),transparent);background-size:42% 100%}
  .n-e::before{right:100%;animation-name:flowLR}
  .n-w::before{left:100%;animation-name:flowRL}
  /* 세로 스포크 (N/S) */
  .n-n::before,.n-s::before{left:50%;width:2px;height:var(--spoke);transform:translateX(-50%);
    background-image:linear-gradient(180deg,transparent,var(--pulse),transparent);background-size:100% 42%}
  .n-n::before{top:100%;animation-name:flowUP}
  .n-s::before{bottom:100%;animation-name:flowDN}

  /* ── 접점 도트(::after) = 깜빡임 ── */
  .node::after{content:"";position:absolute;z-index:2;width:6px;height:6px;border-radius:50%;
    background:var(--dot);animation:blink 1.7s ease-in-out infinite}
  .n-n::after{left:50%;top:calc(100% + var(--spoke));transform:translate(-50%,-50%)}
  .n-s::after{left:50%;bottom:calc(100% + var(--spoke));transform:translate(-50%,50%)}
  .n-e::after{right:calc(100% + var(--spoke));top:50%;transform:translate(50%,-50%)}
  .n-w::after{left:calc(100% + var(--spoke));top:50%;transform:translate(-50%,-50%)}

  /* 펄스 흐름 방향 (코어 → 노드) */
  @keyframes flowLR{0%{background-position:-30% 50%}100%{background-position:130% 50%}}
  @keyframes flowRL{0%{background-position:130% 50%}100%{background-position:-30% 50%}}
  @keyframes flowDN{0%{background-position:50% -30%}100%{background-position:50% 130%}}
  @keyframes flowUP{0%{background-position:50% 130%}100%{background-position:50% -30%}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  /* ============================================================
     LOCKED — 이름을 빗금(암호화)으로 가리고 'ENCRYPTED' 표시.
     번호(01/03/04)만 남아 어느 섹션인지 식별.
     ============================================================ */
  .node.lock{opacity:.66;pointer-events:none}
  .node.lock .n{color:var(--tx3)}
  .node .hatch{height:17px;width:80%;margin-top:3px;border-radius:1px;
    background:repeating-linear-gradient(135deg,var(--line2) 0 5px,transparent 5px 10px)}
  .node.lock .lab{font-family:'Share Tech Mono';font-size:8.5px;letter-spacing:2px;color:var(--tx3);
    margin-top:9px;display:inline-flex;align-items:center;gap:5px}
  .node.lock .lab::before{content:"⊘";font-size:10px}

  /* ============================================================
     CHARACTER (.on) — 접속 가능. 선명 + --acc 발광, 스포크·도트도 밝게.
     ============================================================ */
  .node.on{cursor:pointer;width:236px;--pulse:var(--acc);--dot:var(--acc);
    --track:color-mix(in srgb,var(--acc) 40%,var(--line));
    border-color:color-mix(in srgb,var(--acc) 55%,var(--line));
    background:color-mix(in srgb,var(--acc) 8%,var(--panel));
    box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent),0 0 26px -6px var(--acc)}
  .node.on::before{animation-duration:1.5s;filter:drop-shadow(0 0 5px var(--acc))}
  .node.on::after{box-shadow:0 0 9px 1px var(--acc)}
  .node.on .n{color:var(--acc)}
  .node.on .en{color:var(--acc)}
  .node.on .go{display:inline-block;align-self:flex-end;font-family:'Share Tech Mono';font-size:11px;color:var(--acc);
    margin-top:7px;opacity:.9;transition:transform .25s}
  .node.on:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 42%,transparent),0 0 34px -4px var(--acc)}
  .node.on:hover .go{transform:translateX(4px)}

  /* ===== 부팅 / 접속 오버레이 ===== */
  .connect{position:fixed;inset:22px 12px 14px;border-radius:18px;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;
    padding:0 clamp(40px,10vw,140px);transition:opacity .6s ease,visibility .6s}
  .connect.done{opacity:0;visibility:hidden}
  .connect .ct{font-family:'Share Tech Mono';font-size:11px;letter-spacing:3px;color:var(--tx2);margin-bottom:4px}
  .connect .ct b{color:var(--acc)}
  .connect .cl{font-family:'Share Tech Mono';font-size:12px;letter-spacing:.5px;color:var(--tx2);line-height:2;min-height:2em}
  .connect .cl .ok{color:var(--lime)}
  .connect .cl .cur{display:inline-block;width:6px;height:12px;background:var(--acc);vertical-align:-1px;animation:bl 1s step-end infinite}
  .connect .pbar{margin-top:20px;height:2px;background:var(--line2);width:min(360px,60%)}
  .connect .pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s linear}

  /* ===== 좁은 화면 — 궤도 해제 후 정렬 그리드 ===== */
  @media(max-width:720px){
    .orbit{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
      width:min(440px,94vw);min-height:0;padding:1px;margin:18px auto 4px}
    .orbit .ring{grid-column:1 / -1;justify-self:center;margin:4px 0 6px}
    .node{position:static;transform:none !important;width:auto}
    .node::before,.node::after{display:none}
    .node.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
  }
  @media(prefers-reduced-motion:reduce){
    .node::before{animation:none}.node::after{animation:none}.ring .beacon{animation:none;opacity:0}
  }
</style>
</head>
<body>
  <div class="screen">
    <div class="osbar mono">
      <img class="lg" src="../assets/img/ts_typo.png" alt="">
      <span class="os">TS·OS</span>
      <span class="sec"><span class="d"></span>SECURE LINK</span>
      <div class="right">
        <span>CENTRAL DB</span>
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><span id="batp">82%</span><span class="b"><i></i></span></span>
        <span id="clock">--:--</span>
        <button class="tg" id="themeBtn" title="테마 전환">◐</button>
      </div>
    </div>

    <main class="feature">
      <div class="kick mono">DATABASE ACCESS</div>

      <nav class="orbit">
        <div class="ring">
          <div class="beacon"></div>
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <circle cx="150" cy="150" r="132" fill="none" stroke="var(--line2)" stroke-width="1"/>
            <g class="spin"><circle cx="150" cy="150" r="132" fill="none" stroke="var(--acc)" stroke-width="1.4" stroke-dasharray="40 360" stroke-linecap="round"/><circle cx="150" cy="18" r="2" fill="var(--acc)"/></g>
            <line x1="150" y1="8" x2="150" y2="20" stroke="var(--acc)" stroke-width="1" opacity=".6"/>
            <line x1="150" y1="280" x2="150" y2="292" stroke="var(--line2)" stroke-width="1"/>
            <line x1="8" y1="150" x2="20" y2="150" stroke="var(--line2)" stroke-width="1"/>
            <line x1="280" y1="150" x2="292" y2="150" stroke="var(--line2)" stroke-width="1"/>
          </svg>
          <img class="logo" src="../assets/img/ts_typo.png" alt="TROUBLESHOOTER">
          <span class="rl a">◈ ROOT · TS-DB</span><span class="rl b">ENCRYPTED</span><span class="rl c">SIG ///</span><span class="rl d">READ-ONLY</span>
        </div>

        <!-- N : WORLD (잠금) -->
        <a class="node lock n-n"><span class="n mono">01</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
        <!-- E : CHARACTER (접속 가능) -->
        <a class="node on n-e" href="../characters.html"><span class="n mono">02</span><span class="en">CHARACTER</span><span class="ko">인물 기록</span><span class="st2 mono">6 RECORDS · SECTOR 01</span><span class="go mono">→ ACCESS</span></a>
        <!-- S : RELATIONS (잠금) -->
        <a class="node lock n-s"><span class="n mono">03</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
        <!-- W : GALLERY (잠금) -->
        <a class="node lock n-w"><span class="n mono">04</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
      </nav>

      <div class="sub mono">INTEGRATED ARCHIVE · 통합 아카이브</div>
      <div class="boot mono"><span id="boot2"></span><span class="c"></span></div>
    </main>

    <footer class="foot">
      <span><span class="g">GUEST</span> · UID 000-ACCESS</span>
      <span class="r">TS-DB · TERMINAL v2.04</span>
    </footer>
  </div>

  <!-- 접속 시퀀스 오버레이 -->
  <div class="connect" id="connect">
    <div class="ct mono">TS·OS <b>HANDHELD ARCHIVE TERMINAL</b> v2.04</div>
    <div class="cl mono" id="cl"></div>
    <div class="pbar"><i id="pb"></i></div>
  </div>

<script>
  var steps=['POWER ON · TS-TERM MDL-2','ESTABLISHING SECURE LINK','AUTHENTICATING OPERATOR · GUEST','HANDSHAKE · CENTRAL ARCHIVE','CHANNEL ENCRYPTED'];
  var cl=document.getElementById('cl'),pb=document.getElementById('pb'),ci=0,html='';
  function step(){
    if(ci<steps.length){
      html+='<div><span class="ok">✓</span> '+steps[ci]+'</div>';cl.innerHTML=html;
      pb.style.width=Math.round((ci+1)/steps.length*100)+'%';ci++;setTimeout(step,440);
    }else{
      cl.innerHTML=html+'<div>ENTERING DATABASE<span class="cur"></span></div>';
      setTimeout(function(){document.getElementById('connect').classList.add('done');typeBoot();},700);
    }
  }
  function typeBoot(){var m="CONNECTION ENCRYPTED · AUTHORIZED ACCESS ONLY",e=document.getElementById("boot2"),j=0;(function t(){if(j<=m.length){e.textContent=m.slice(0,j);j++;setTimeout(t,40);}})();}
  setTimeout(step,400);
</script>
</body>
</html>
