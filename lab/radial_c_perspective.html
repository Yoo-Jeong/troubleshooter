<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS·OS // RADIAL C — 3D PERSPECTIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=Share+Tech+Mono&family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/common.css?v=2">
<script src="../assets/js/common.js?v=2"></script>

<style>
  .feature{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px 0}
  .feature .kick{font-family:'Share Tech Mono';font-size:11px;letter-spacing:4px;color:var(--acc);margin-bottom:clamp(12px,2.6vh,22px)}
  .feature .sub{font-family:'Share Tech Mono';font-size:12.5px;letter-spacing:2.5px;color:var(--tx2);margin-top:clamp(14px,2.8vh,26px)}
  .feature .boot{font-family:'Share Tech Mono';font-size:12px;color:var(--tx3);margin-top:12px;height:16px}
  .feature .boot .c{display:inline-block;width:5px;height:11px;background:var(--acc);vertical-align:-1px;margin-left:1px;animation:bl 1.1s step-end infinite}
  @keyframes bl{50%{opacity:0}}

  /* ============================================================
     3D 원근 궤도 (기울어진 원반) — 진짜 rotateX 대신 "타원 배치 + 깊이 스케일".
     노드를 타원(가로 rx > 세로 ry) 위에 놓고, 앞(아래)은 크게/선명,
     뒤(위)는 작게/흐리게. 텍스트는 눕지 않아 또렷.
     ============================================================ */
  .orbit{position:relative;width:min(860px,96vw);min-height:clamp(420px,58vh,520px);
    display:flex;align-items:center;justify-content:center;margin:2px auto;
    --rx:clamp(238px,33vw,320px);            /* 궤도 가로 반경 */
    --ry:clamp(142px,20vh,182px);            /* 궤도 세로 반경 (원반 기울기) */
    --discR:clamp(74px,9.5vh,92px);          /* 중앙 코어 반경 */
    --hlen:calc(var(--rx) - var(--discR) - 60px);   /* 좌우 스포크 길이 */
    --vlen:calc(var(--ry) - var(--discR) - 40px)}   /* 상하 스포크 길이 */

  /* 궤도면(타원 림) */
  .discfloor{position:absolute;left:50%;top:50%;width:calc(var(--rx)*2);height:calc(var(--ry)*2);
    transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:50%;opacity:.55}
  .discfloor::after{content:"";position:absolute;inset:15% 11%;border:1px solid var(--line);border-radius:50%;opacity:.5}

  /* 코어 (정면 원 + 로고) */
  .core{position:absolute;left:50%;top:50%;width:calc(var(--discR)*2);height:calc(var(--discR)*2);
    transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;z-index:3}
  .core svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .core .spin{transform-origin:150px 150px;animation:sp 90s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .core .logo{width:72%;opacity:.92}
  :root[data-theme="light"] .core .logo{filter:brightness(.6) saturate(1.5)}
  .core .beacon{position:absolute;inset:0;border-radius:50%;border:1px solid var(--acc);opacity:0;animation:beacon 3.4s ease-out infinite}
  @keyframes beacon{0%{transform:scale(.8);opacity:.5}70%{opacity:0}100%{transform:scale(1.3);opacity:0}}

  /* 스포크 (축 방향, 코어→노드) */
  .spoke{position:absolute;left:50%;top:50%;height:2px;transform-origin:0 50%;
    transform:rotate(var(--ang)) translateX(var(--discR));width:var(--len);z-index:2;
    background-color:var(--track,var(--line));
    background-image:linear-gradient(90deg,transparent,var(--pulse,var(--tx3)),transparent);
    background-size:42% 100%;background-repeat:no-repeat;animation:flow var(--spd,2.8s) linear infinite}
  .sp-r{--ang:0deg;--len:var(--hlen)}
  .sp-l{--ang:180deg;--len:var(--hlen)}
  .sp-t{--ang:270deg;--len:var(--vlen)}
  .sp-b{--ang:90deg;--len:var(--vlen)}
  .spoke .dot{position:absolute;left:100%;top:50%;width:6px;height:6px;border-radius:50%;
    background:var(--dot,var(--tx3));transform:translate(-50%,-50%);animation:blink 1.7s ease-in-out infinite}
  .spoke.on{--pulse:var(--acc);--track:color-mix(in srgb,var(--acc) 40%,var(--line));--dot:var(--acc);--spd:1.5s;filter:drop-shadow(0 0 5px var(--acc))}
  @keyframes flow{0%{background-position:-30% 50%}100%{background-position:130% 50%}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  /* 노드 (타원 위, 깊이 스케일) */
  .node{position:absolute;left:50%;top:50%;width:140px;box-sizing:border-box;
    background:var(--panel);border:1px solid var(--line);
    padding:10px 12px 11px;display:flex;flex-direction:column;gap:3px;
    transform:translate(-50%,-50%) translate(var(--x),var(--y)) scale(var(--sc,1));
    transition:border-color .25s,background .25s,box-shadow .25s}
  .node .n{font-family:'Share Tech Mono';font-size:10px;letter-spacing:1px;color:var(--tx3)}
  .node .en{font-family:'Chakra Petch';font-weight:500;font-size:14px;letter-spacing:.5px;margin-top:2px;color:var(--tx)}
  .node .ko{font-size:12px;color:var(--tx2)}
  .node .st2{font-family:'Share Tech Mono';font-size:8.5px;letter-spacing:.5px;color:var(--tx3);margin-top:6px}

  /* 방위/깊이 : WORLD=뒤(작게·흐리게), RELATIONS=앞(크게), CHARACTER=우, GALLERY=좌 */
  .c1{--x:0;--y:calc(-1 * var(--ry));--sc:.84;opacity:.82;z-index:1}
  .c2{--x:var(--rx);--y:0;--sc:1;z-index:4}
  .c3{--x:0;--y:var(--ry);--sc:1.08;z-index:5}
  .c4{--x:calc(-1 * var(--rx));--y:0;--sc:1;z-index:3}

  /* LOCKED — 이름 완전 가림(빗금) + 번호 + ⊘ ENCRYPTED */
  .node.lock{opacity:.72}
  .c1.lock{opacity:.6}
  .node.lock .n{color:var(--tx3)}
  .node .hatch{height:16px;width:80%;margin-top:3px;border-radius:1px;
    background:repeating-linear-gradient(135deg,var(--line2) 0 5px,transparent 5px 9px)}
  .node.lock .lab{font-family:'Share Tech Mono';font-size:8.5px;letter-spacing:2px;color:var(--tx3);
    margin-top:7px;display:inline-flex;align-items:center;gap:5px}
  .node.lock .lab::before{content:"⊘";font-size:10px}

  /* CHARACTER (.on) — 가로 1.6배 + 발광. 맨 아랫줄 = 레코드(좌) + → ACCESS(우) 한 줄 */
  .node.on{cursor:pointer;width:236px;
    border-color:color-mix(in srgb,var(--acc) 55%,var(--line));
    background:color-mix(in srgb,var(--acc) 8%,var(--panel));
    box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent),0 0 26px -6px var(--acc)}
  .node.on .n,.node.on .en{color:var(--acc)}
  .node.on .botrow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-top:9px}
  .node.on .botrow .st2{margin-top:0}
  .node.on .go{font-family:'Share Tech Mono';font-size:11px;color:var(--acc);opacity:.9;white-space:nowrap;transition:transform .25s}
  .node.on:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 42%,transparent),0 0 34px -4px var(--acc)}
  .node.on:hover .go{transform:translateX(4px)}

  /* 부팅 오버레이 */
  .connect{position:fixed;inset:22px 12px 14px;border-radius:18px;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 clamp(40px,10vw,140px);transition:opacity .6s ease,visibility .6s}
  .connect.done{opacity:0;visibility:hidden}
  .connect .ct{font-family:'Share Tech Mono';font-size:11px;letter-spacing:3px;color:var(--tx2);margin-bottom:4px}
  .connect .ct b{color:var(--acc)}
  .connect .cl{font-family:'Share Tech Mono';font-size:12px;letter-spacing:.5px;color:var(--tx2);line-height:2;min-height:2em}
  .connect .cl .ok{color:var(--lime)}
  .connect .cl .cur{display:inline-block;width:6px;height:12px;background:var(--acc);vertical-align:-1px;animation:bl 1s step-end infinite}
  .connect .pbar{margin-top:20px;height:2px;background:var(--line2);width:min(360px,60%)}
  .connect .pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s linear}

  @media(max-width:720px){
    .discfloor,.core,.spoke{display:none}
    .orbit{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);width:min(440px,94vw);min-height:0;padding:1px;margin:16px auto 4px}
    .node{position:static;transform:none !important;width:auto;opacity:1 !important}
    .node.on{grid-column:1/-1;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
  }
  @media(prefers-reduced-motion:reduce){.spoke{animation:none}.spoke .dot{animation:none}.core .spin,.core .beacon{animation:none;opacity:0}}
</style>
</head>
<body>
  <div class="screen">
    <div class="osbar mono">
      <img class="lg" src="../assets/img/ts_typo.png" alt="">
      <span class="os">TS·OS</span>
      <span class="sec"><span class="d"></span>SECURE LINK</span>
      <div class="right">
        <span>CENTRAL DB</span>
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><span id="batp">82%</span><span class="b"><i></i></span></span>
        <span id="clock">--:--</span>
        <button class="tg" id="themeBtn" title="테마 전환">◐</button>
      </div>
    </div>

    <main class="feature">
      <div class="kick mono">DATABASE ACCESS</div>

      <nav class="orbit">
        <div class="discfloor"></div>

        <div class="core">
          <div class="beacon"></div>
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <circle cx="150" cy="150" r="140" fill="none" stroke="var(--line2)" stroke-width="1"/>
            <g class="spin"><circle cx="150" cy="150" r="140" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-dasharray="42 380" stroke-linecap="round"/><circle cx="150" cy="10" r="2.4" fill="var(--acc)"/></g>
          </svg>
          <img class="logo" src="../assets/img/ts_typo.png" alt="TROUBLESHOOTER">
        </div>

        <!-- 스포크 -->
        <i class="spoke sp-t"><span class="dot"></span></i>
        <i class="spoke sp-r on"><span class="dot"></span></i>
        <i class="spoke sp-b"><span class="dot"></span></i>
        <i class="spoke sp-l"><span class="dot"></span></i>

        <!-- 노드 -->
        <a class="node lock c1"><span class="n mono">01</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
        <a class="node on c2" href="../characters.html"><span class="n mono">02</span><span class="en">CHARACTER</span><span class="ko">인물 기록</span><span class="botrow"><span class="st2 mono">6 RECORDS · SECTOR 01</span><span class="go mono">→ ACCESS</span></span></a>
        <a class="node lock c3"><span class="n mono">03</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
        <a class="node lock c4"><span class="n mono">04</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
      </nav>

      <div class="sub mono">INTEGRATED ARCHIVE · 통합 아카이브</div>
      <div class="boot mono"><span id="boot2"></span><span class="c"></span></div>
    </main>

    <footer class="foot">
      <span><span class="g">GUEST</span> · UID 000-ACCESS</span>
      <span class="r">TS-DB · TERMINAL v2.04</span>
    </footer>
  </div>

  <div class="connect" id="connect">
    <div class="ct mono">TS·OS <b>HANDHELD ARCHIVE TERMINAL</b> v2.04</div>
    <div class="cl mono" id="cl"></div>
    <div class="pbar"><i id="pb"></i></div>
  </div>

<script>
  var steps=['POWER ON · TS-TERM MDL-2','ESTABLISHING SECURE LINK','AUTHENTICATING OPERATOR · GUEST','HANDSHAKE · CENTRAL ARCHIVE','CHANNEL ENCRYPTED'];
  var cl=document.getElementById('cl'),pb=document.getElementById('pb'),ci=0,html='';
  function step(){
    if(ci<steps.length){html+='<div><span class="ok">✓</span> '+steps[ci]+'</div>';cl.innerHTML=html;pb.style.width=Math.round((ci+1)/steps.length*100)+'%';ci++;setTimeout(step,440);}
    else{cl.innerHTML=html+'<div>ENTERING DATABASE<span class="cur"></span></div>';setTimeout(function(){document.getElementById('connect').classList.add('done');typeBoot();},700);}
  }
  function typeBoot(){var m="CONNECTION ENCRYPTED · AUTHORIZED ACCESS ONLY",e=document.getElementById("boot2"),j=0;(function t(){if(j<=m.length){e.textContent=m.slice(0,j);j++;setTimeout(t,40);}})();}
  setTimeout(step,400);
</script>
</body>
</html>
