<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TS·OS // RADIAL A — DIAGONAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600&family=Share+Tech+Mono&family=Gothic+A1:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/common.css?v=2">
<script src="../assets/js/common.js?v=2"></script>

<style>
  .feature{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px 0}
  .feature .kick{font-family:'Share Tech Mono';font-size:11px;letter-spacing:4px;color:var(--acc);margin-bottom:clamp(16px,3.4vh,30px)}
  .ring{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .ring svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .ring .spin{transform-origin:150px 150px;animation:sp 90s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ring .logo{width:54%;opacity:.9}
  :root[data-theme="light"] .ring .logo{filter:brightness(.6) saturate(1.5)}
  .ring .rl{position:absolute;font-family:'Share Tech Mono';font-size:8px;letter-spacing:1.5px;color:var(--tx3);white-space:nowrap}
  .ring .rl.a{top:-2px;left:-6px}.ring .rl.b{top:-2px;right:-6px}.ring .rl.c{bottom:-2px;left:-6px}.ring .rl.d{bottom:-2px;right:-6px}
  .ring .beacon{position:absolute;inset:0;border-radius:50%;border:1px solid var(--acc);opacity:0;animation:beacon 3.4s ease-out infinite}
  @keyframes beacon{0%{transform:scale(.72);opacity:.5}70%{opacity:0}100%{transform:scale(1.25);opacity:0}}

  .feature .sub{font-family:'Share Tech Mono';font-size:12.5px;letter-spacing:2.5px;color:var(--tx2);margin-top:clamp(18px,3.6vh,32px)}
  .feature .boot{font-family:'Share Tech Mono';font-size:12px;color:var(--tx3);margin-top:12px;height:16px}
  .feature .boot .c{display:inline-block;width:5px;height:11px;background:var(--acc);vertical-align:-1px;margin-left:1px;animation:bl 1.1s step-end infinite}
  @keyframes bl{50%{opacity:0}}

  /* ============================================================
     ORBIT (극좌표) — 각 노드/스포크는 --ang(방위각)만으로 배치.
     대각선 X : 네 귀퉁이(±45°). 노드는 정면 유지(카운터 회전).
     ============================================================ */
  .orbit{position:relative;display:flex;align-items:center;justify-content:center;
    width:min(760px,94vw);
    --ringsz:clamp(168px,22vh,206px);
    --ringR:calc(var(--ringsz) * .44);
    --out:clamp(110px,16vh,148px);             /* 원 가장자리 → 노드 중심 여유 (등거리) */
    --core:calc(var(--ringR) + var(--out));     /* 중심 → 노드 중심 거리 */
    --inset:48px;                                /* 노드 중심 → 안쪽 모서리(대략) */
    --spokelen:calc(var(--out) - var(--inset)); /* 스포크 길이 = 그 사이 */
    min-height:calc(var(--core)*1.5 + 200px);
    margin:2px auto}
  .orbit .ring{margin:0;width:var(--ringsz);z-index:2}

  /* 방위각 (대각선 X) — q2=CHARACTER 는 우상단 유지 */
  .q1{--ang:-135deg}   /* WORLD  좌상 */
  .q2{--ang:-45deg}    /* CHARACTER 우상 */
  .q3{--ang:45deg}     /* RELATIONS 우하 */
  .q4{--ang:135deg}    /* GALLERY 좌하 */

  .node{position:absolute;top:50%;left:50%;width:146px;box-sizing:border-box;
    background:var(--panel);border:1px solid var(--line);
    padding:10px 12px 11px;display:flex;flex-direction:column;gap:3px;z-index:3;
    transform:translate(-50%,-50%) rotate(var(--ang)) translateX(var(--core)) rotate(calc(-1 * var(--ang)));
    transition:border-color .25s,background .25s,box-shadow .25s}
  .node .n{font-family:'Share Tech Mono';font-size:10px;letter-spacing:1px;color:var(--tx3)}
  .node .en{font-family:'Chakra Petch';font-weight:500;font-size:14px;letter-spacing:.5px;margin-top:2px;color:var(--tx)}
  .node .ko{font-size:12px;color:var(--tx2)}
  .node .st2{font-family:'Share Tech Mono';font-size:8.5px;letter-spacing:.5px;color:var(--tx3);margin-top:6px}

  /* 스포크 = 연결선 + 흐르는 펄스 + 접점 도트 (중심에서 --ang 방향으로 뻗음) */
  .orbit .spoke{position:absolute;left:50%;top:50%;height:2px;z-index:1;width:var(--spokelen);
    transform-origin:0 50%;transform:rotate(var(--ang)) translateX(var(--ringR));
    background-color:var(--track,var(--line));
    background-image:linear-gradient(90deg,transparent,var(--pulse,var(--tx3)),transparent);
    background-size:42% 100%;background-repeat:no-repeat;
    animation:flow var(--spd,2.8s) linear infinite}
  .orbit .spoke .dot{position:absolute;left:100%;top:50%;width:6px;height:6px;border-radius:50%;
    background:var(--dot,var(--tx3));transform:translate(-50%,-50%);animation:blink 1.7s ease-in-out infinite}
  .orbit .spoke.on{--pulse:var(--acc);--track:color-mix(in srgb,var(--acc) 40%,var(--line));--dot:var(--acc);--spd:1.5s;
    filter:drop-shadow(0 0 5px var(--acc))}
  @keyframes flow{0%{background-position:-30% 50%}100%{background-position:130% 50%}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

  /* LOCKED — 이름 완전 가림(빗금) + 번호 + ⊘ ENCRYPTED */
  .node.lock{opacity:.72}
  .node.lock .n{color:var(--tx3)}
  .node .hatch{height:17px;width:80%;margin-top:3px;border-radius:1px;
    background:repeating-linear-gradient(135deg,var(--line2) 0 5px,transparent 5px 9px)}
  .node.lock .lab{font-family:'Share Tech Mono';font-size:8.5px;letter-spacing:2px;color:var(--tx3);
    margin-top:8px;display:inline-flex;align-items:center;gap:5px}
  .node.lock .lab::before{content:"⊘";font-size:10px}

  /* CHARACTER (.on) — 선명 + --acc 발광 */
  .node.on{cursor:pointer;width:236px;
    border-color:color-mix(in srgb,var(--acc) 55%,var(--line));
    background:color-mix(in srgb,var(--acc) 8%,var(--panel));
    box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent),0 0 26px -6px var(--acc)}
  .node.on .n,.node.on .en{color:var(--acc)}
  .node.on .go{display:inline-block;align-self:flex-end;font-family:'Share Tech Mono';font-size:11px;color:var(--acc);margin-top:7px;opacity:.9;transition:transform .25s}
  .node.on:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 42%,transparent),0 0 34px -4px var(--acc)}
  .node.on:hover .go{transform:translateX(4px)}

  /* 부팅 오버레이 */
  .connect{position:fixed;inset:22px 12px 14px;border-radius:18px;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:0 clamp(40px,10vw,140px);transition:opacity .6s ease,visibility .6s}
  .connect.done{opacity:0;visibility:hidden}
  .connect .ct{font-family:'Share Tech Mono';font-size:11px;letter-spacing:3px;color:var(--tx2);margin-bottom:4px}
  .connect .ct b{color:var(--acc)}
  .connect .cl{font-family:'Share Tech Mono';font-size:12px;letter-spacing:.5px;color:var(--tx2);line-height:2;min-height:2em}
  .connect .cl .ok{color:var(--lime)}
  .connect .cl .cur{display:inline-block;width:6px;height:12px;background:var(--acc);vertical-align:-1px;animation:bl 1s step-end infinite}
  .connect .pbar{margin-top:20px;height:2px;background:var(--line2);width:min(360px,60%)}
  .connect .pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s linear}

  @media(max-width:720px){
    .orbit{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);width:min(440px,94vw);min-height:0;padding:1px;margin:16px auto 4px}
    .orbit .ring{grid-column:1/-1;justify-self:center;margin:4px 0 6px;width:clamp(150px,40vw,190px)}
    .node{position:static;transform:none !important;width:auto}
    .orbit .spoke{display:none}
    .node.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent)}
  }
  @media(prefers-reduced-motion:reduce){.orbit .spoke{animation:none}.orbit .spoke .dot{animation:none}.ring .beacon{animation:none;opacity:0}}
</style>
</head>
<body>
  <div class="screen">
    <div class="osbar mono">
      <img class="lg" src="../assets/img/ts_typo.png" alt="">
      <span class="os">TS·OS</span>
      <span class="sec"><span class="d"></span>SECURE LINK</span>
      <div class="right">
        <span>CENTRAL DB</span>
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="bat"><span id="batp">82%</span><span class="b"><i></i></span></span>
        <span id="clock">--:--</span>
        <button class="tg" id="themeBtn" title="테마 전환">◐</button>
      </div>
    </div>

    <main class="feature">
      <div class="kick mono">DATABASE ACCESS</div>

      <nav class="orbit">
        <div class="ring">
          <div class="beacon"></div>
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <circle cx="150" cy="150" r="132" fill="none" stroke="var(--line2)" stroke-width="1"/>
            <g class="spin"><circle cx="150" cy="150" r="132" fill="none" stroke="var(--acc)" stroke-width="1.4" stroke-dasharray="40 360" stroke-linecap="round"/><circle cx="150" cy="18" r="2" fill="var(--acc)"/></g>
            <line x1="150" y1="8" x2="150" y2="20" stroke="var(--acc)" stroke-width="1" opacity=".6"/>
            <line x1="150" y1="280" x2="150" y2="292" stroke="var(--line2)" stroke-width="1"/>
            <line x1="8" y1="150" x2="20" y2="150" stroke="var(--line2)" stroke-width="1"/>
            <line x1="280" y1="150" x2="292" y2="150" stroke="var(--line2)" stroke-width="1"/>
          </svg>
          <img class="logo" src="../assets/img/ts_typo.png" alt="TROUBLESHOOTER">
          <span class="rl a">◈ ROOT · TS-DB</span><span class="rl b">ENCRYPTED</span><span class="rl c">SIG ///</span><span class="rl d">READ-ONLY</span>
        </div>

        <!-- 스포크 (연결선) -->
        <i class="spoke q1"><span class="dot"></span></i>
        <i class="spoke q2 on"><span class="dot"></span></i>
        <i class="spoke q3"><span class="dot"></span></i>
        <i class="spoke q4"><span class="dot"></span></i>

        <!-- 노드 -->
        <a class="node lock q1"><span class="n mono">01</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
        <a class="node on q2" href="../characters.html"><span class="n mono">02</span><span class="en">CHARACTER</span><span class="ko">인물 기록</span><span class="st2 mono">6 RECORDS · SECTOR 01</span><span class="go mono">→ ACCESS</span></a>
        <a class="node lock q3"><span class="n mono">03</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
        <a class="node lock q4"><span class="n mono">04</span><span class="hatch"></span><span class="lab mono">ENCRYPTED</span></a>
      </nav>

      <div class="sub mono">INTEGRATED ARCHIVE · 통합 아카이브</div>
      <div class="boot mono"><span id="boot2"></span><span class="c"></span></div>
    </main>

    <footer class="foot">
      <span><span class="g">GUEST</span> · UID 000-ACCESS</span>
      <span class="r">TS-DB · TERMINAL v2.04</span>
    </footer>
  </div>

  <div class="connect" id="connect">
    <div class="ct mono">TS·OS <b>HANDHELD ARCHIVE TERMINAL</b> v2.04</div>
    <div class="cl mono" id="cl"></div>
    <div class="pbar"><i id="pb"></i></div>
  </div>

<script>
  var steps=['POWER ON · TS-TERM MDL-2','ESTABLISHING SECURE LINK','AUTHENTICATING OPERATOR · GUEST','HANDSHAKE · CENTRAL ARCHIVE','CHANNEL ENCRYPTED'];
  var cl=document.getElementById('cl'),pb=document.getElementById('pb'),ci=0,html='';
  function step(){
    if(ci<steps.length){html+='<div><span class="ok">✓</span> '+steps[ci]+'</div>';cl.innerHTML=html;pb.style.width=Math.round((ci+1)/steps.length*100)+'%';ci++;setTimeout(step,440);}
    else{cl.innerHTML=html+'<div>ENTERING DATABASE<span class="cur"></span></div>';setTimeout(function(){document.getElementById('connect').classList.add('done');typeBoot();},700);}
  }
  function typeBoot(){var m="CONNECTION ENCRYPTED · AUTHORIZED ACCESS ONLY",e=document.getElementById("boot2"),j=0;(function t(){if(j<=m.length){e.textContent=m.slice(0,j);j++;setTimeout(t,40);}})();}
  setTimeout(step,400);
</script>
</body>
</html>
